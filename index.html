<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flax-page</title>
    <link rel="stylesheet" href="./assets/style/_style.css" />
  </head>
  <body>
    <form class="form-container">
      <div class="form-title">
        <h2>Create an account</h2>
        <p>We always keep your name and email address private.</p>
      </div>
      <div class="form-input">
        <input type="text" placeholder="First name" />
        <input type="text" placeholder="Last name" />
      </div>
      <div class="form-input">
        <input type="text" placeholder="Display name" />
        <input type="email" placeholder="Email address" />
      </div>
      <div class="form-input">
        <input type="password" placeholder="Password" />
        <input type="password" placeholder="Password comfirmation" />
      </div>
      <div class="form-radio">
        <input type="radio" name="radio" id="bayer" />
        <div class="input-label">
          <label for="bayer">Join As a Buyer</label>
          <p>
            I am looking for a Name, Logo or Tagline for my business, brand or
            product.
          </p>
        </div>
      </div>
      <div class="form-radio">
        <input type="radio" name="radio" id="seller" />
        <div class="input-lable">
          <label for="seller">Join As a Creative or Marketplace Seller</label>
          <p>
            I plan to submit neme ideas, Logo designs or sell names in Domain
            Marketplace.
          </p>
        </div>
      </div>
      <div class="form-check">
        <input type="checkbox" name="radio" id="allow" />
        <label for="allow">
          Allow Squadhelp to send marketing/promotional offers from time to time
        </label>
      </div>
      <input type="submit" name="create" value="Create account" />
    </form>
  </body>
</html>
